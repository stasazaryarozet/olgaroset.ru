<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root {
  --accent: #E31B1B;
  --text: #000000;
  --text-muted: #666666;
  --bg: #ffffff;
  --font-display: 'Cormorant Garamond', Georgia, serif;
  --font-body: 'Inter', -apple-system, sans-serif;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

body {
  color: var(--text);
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem 1.5rem;
}

.container {
  max-width: 600px;
  width: 100%;
}

h1 {
  font-family: var(--font-display);
  font-size: 2.5rem;
  font-weight: 400;
  line-height: 1.2;
  margin-bottom: 0.5rem;
  text-align: center;
}

.subtitle {
  font-size: 1rem;
  color: var(--text-muted);
  text-align: center;
  margin-bottom: 3rem;
}

.info {
  background: #fafafa;
  padding: 2rem;
  margin-bottom: 2rem;
  border-left: 3px solid var(--accent);
}

.info-item {
  display: flex;
  justify-content: space-between;
  padding: 0.75rem 0;
  border-bottom: 1px solid #e5e5e5;
}

.info-item:last-child {
  border-bottom: none;
}

.info-label {
  font-weight: 600;
}

.info-value {
  text-align: right;
  color: var(--text-muted);
}

.calendar-btn {
  display: inline-block;
  margin-top: 1.5rem;
  padding: 0.75rem 1.5rem;
  background: transparent;
  color: var(--text);
  border: 1px solid var(--text);
  border-radius: 4px;
  text-decoration: none;
  font-size: 0.95rem;
  transition: all 0.2s;
  cursor: pointer;
}

.calendar-btn:hover {
  background: var(--text);
  color: var(--bg);
}

.price {
  font-size: 3rem;
  font-family: var(--font-display);
  font-weight: 600;
  text-align: center;
  margin: 2rem 0 1rem;
}

.price-note {
  text-align: center;
  color: var(--text-muted);
  font-size: 0.9rem;
  margin-bottom: 2rem;
}

.availability {
  background: #fff8f0;
  border: 1px solid #ffcc80;
  padding: 1rem 1.5rem;
  margin-bottom: 2rem;
  text-align: center;
  border-radius: 4px;
}

.seats-left {
  font-size: 1.5rem;
  font-weight: 600;
  color: var(--accent);
  margin-bottom: 0.5rem;
}

.seats-total {
  font-size: 0.9rem;
  color: var(--text-muted);
}

.cta {
  display: block;
  width: 100%;
  padding: 1.25rem 2rem;
  background: var(--accent);
  color: white;
  text-align: center;
  text-decoration: none;
  font-size: 1.1rem;
  font-weight: 600;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.2s;
  margin-bottom: 1rem;
}

.cta:hover {
  background: #c41717;
  transform: translateY(-1px);
}

.cta:disabled {
  background: #999;
  cursor: not-allowed;
  transform: none;
}

.format {
  margin-top: 3rem;
  padding-top: 2rem;
  border-top: 1px solid #e5e5e5;
}

.format h2 {
  font-family: var(--font-display);
  font-size: 1.5rem;
  font-weight: 600;
  margin-bottom: 1.5rem;
}

.format ul {
  list-style: none;
  padding: 0;
}

.format li {
  padding: 0.75rem 0;
  padding-left: 1.5rem;
  position: relative;
}

.format li:before {
  content: "—";
  position: absolute;
  left: 0;
  color: var(--accent);
}

.footer {
  margin-top: 3rem;
  padding-top: 2rem;
  border-top: 1px solid #e5e5e5;
  text-align: center;
  color: var(--text-muted);
  font-size: 0.9rem;
}

.footer a {
  color: var(--accent);
  text-decoration: none;
}

.footer a:hover {
  text-decoration: underline;
}

@media (max-width: 600px) {
  h1 {
    font-size: 2rem;
  }
  .price {
    font-size: 2.5rem;
  }
}
</style>
</head>

<div class="container">

  </p>
</div>
